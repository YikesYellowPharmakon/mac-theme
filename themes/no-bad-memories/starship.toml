# generated by theme-pack from the active omacosy theme
format = """
[](fg:#E5281A)\
$os\
$username\
[](fg:#E5281A bg:#E3CB15)\
$directory\
[](fg:#E3CB15 bg:#3FBF4A)\
$git_branch\
$git_status\
[](fg:#3FBF4A bg:#2E86DC)\
$nodejs\
$python\
$rust\
$golang\
$ruby\
$php\
$java\
$bun\
[](fg:#2E86DC bg:#6E5C8C)\
$docker_context\
$custom\
[](fg:#6E5C8C)\
$line_break$character"""

add_newline = false

[os]
disabled = false
style = "bg:#E5281A fg:#F4EEF8"
format = "[$symbol]($style)"

[os.symbols]
Macos = ""

[username]
show_always = true
style_user = "bg:#E5281A fg:#F4EEF8 bold"
style_root = "bg:#E5281A fg:#F4EEF8 bold"
format = "[ $user ]($style)"

[directory]
style = "fg:#1B1035 bg:#E3CB15 bold"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#3FBF4A"
format = '[[ $symbol $branch ](fg:#1B1035 bg:#3FBF4A)]($style)'

[git_status]
style = "bg:#3FBF4A"
format = '[[($all_status$ahead_behind )](fg:#1B1035 bg:#3FBF4A)]($style)'

[nodejs]
symbol = ""
style = "bg:#2E86DC"
format = '[[ $symbol $version ](fg:#F4EEF8 bg:#2E86DC)]($style)'

[python]
symbol = ""
style = "bg:#2E86DC"
format = '[[ $symbol $version ](fg:#F4EEF8 bg:#2E86DC)]($style)'

[rust]
symbol = ""
style = "bg:#2E86DC"
format = '[[ $symbol $version ](fg:#F4EEF8 bg:#2E86DC)]($style)'

[golang]
symbol = ""
style = "bg:#2E86DC"
format = '[[ $symbol $version ](fg:#F4EEF8 bg:#2E86DC)]($style)'

[ruby]
symbol = ""
style = "bg:#2E86DC"
format = '[[ $symbol $version ](fg:#F4EEF8 bg:#2E86DC)]($style)'

[php]
symbol = ""
style = "bg:#2E86DC"
format = '[[ $symbol $version ](fg:#F4EEF8 bg:#2E86DC)]($style)'

[java]
symbol = ""
style = "bg:#2E86DC"
format = '[[ $symbol $version ](fg:#F4EEF8 bg:#2E86DC)]($style)'

[bun]
symbol = ""
style = "bg:#2E86DC"
format = '[[ $symbol $version ](fg:#F4EEF8 bg:#2E86DC)]($style)'

[docker_context]
symbol = ""
style = "bg:#6E5C8C"
format = '[[ $symbol $context ](fg:#F4EEF8 bg:#6E5C8C)]($style)'

[custom.shellmark]
when = "test \"${SHLVL:-1}\" -gt 2"
command = "printf Z"
style = "bg:#6E5C8C fg:#F4EEF8 bold"
format = "[ $output ]($style)"

[line_break]
disabled = false

[character]
success_symbol = "[>](fg:#F4EEF8 bold)"
error_symbol = "[>](fg:#E5281A bold)"
vimcmd_symbol = "[>](fg:#F4EEF8 bold)"
vimcmd_replace_one_symbol = "[>](fg:#E5281A bold)"
vimcmd_replace_symbol = "[>](fg:#E5281A bold)"
vimcmd_visual_symbol = "[>](fg:#E3CB15 bold)"
