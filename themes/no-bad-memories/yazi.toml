# generated by theme-pack from the active omacosy theme

[mgr]
cwd = { fg = "#05ADCD" }
find_keyword = { fg = "#E3CB15", bold = true, italic = true }
find_position = { fg = "#E5281A", bold = true }
marker_copied = { fg = "#E3CB15", bg = "#E3CB15" }
marker_cut = { fg = "#E5281A", bg = "#E5281A" }
marker_selected = { fg = "#3FBF4A", bg = "#3FBF4A" }
marker_symbol = "│"
border_style = { fg = "#E5281A" }

[tabs]
active = { fg = "#F4EEF8", bg = "#E5281A", bold = true }
inactive = { fg = "#685785", bg = "#3b1330" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[indicator]
parent = { fg = "#F4EEF8", bg = "#3b1330" }
current = { fg = "#F4EEF8", bg = "#E5281A", bold = true }
preview = { underline = true }
padding = { open = "", close = "" }

[mode]
normal_main = { fg = "#F4EEF8", bg = "#E5281A", bold = true }
normal_alt = { fg = "#E5281A", bg = "#3b1330" }
select_main = { fg = "#1B1035", bg = "#E3CB15", bold = true }
select_alt = { fg = "#E3CB15", bg = "#3b1330" }
unset_main = { fg = "#F4EEF8", bg = "#E5281A", bold = true }
unset_alt = { fg = "#E5281A", bg = "#3b1330" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#05ADCD" }
perm_read = { fg = "#3FBF4A" }
perm_write = { fg = "#E5281A" }
perm_exec = { fg = "#E3CB15" }
progress_normal = { fg = "#05ADCD", bg = "#3b1330" }
progress_error = { fg = "#E5281A", bg = "#3b1330" }

[which]
mask = { bg = "#1B1035" }
cand = { fg = "#05ADCD" }
rest = { fg = "#685785" }
desc = { fg = "#E3CB15" }
separator_style = { fg = "#685785" }

[input]
border = { fg = "#E5281A" }
selected = { fg = "#F4EEF8", bg = "#E5281A" }

[cmp]
border = { fg = "#E5281A" }
active = { fg = "#F4EEF8", bg = "#E5281A", bold = true }

[notify]
title_info = { fg = "#05ADCD" }
title_warn = { fg = "#3FBF4A" }
title_error = { fg = "#E5281A" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#3FBF4A" },
  { mime = "**/{audio,video}/*", fg = "#E3CB15" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#E5281A" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#05ADCD" },
  { url = "*/", fg = "#05ADCD" },
]

[pick]
border = { fg = "#E5281A" }
active = { fg = "#E3CB15", bold = true }

[tasks]
border = { fg = "#E5281A" }
hovered = { fg = "#E3CB15", bold = true }

[spot]
border = { fg = "#E5281A" }
title = { fg = "#E5281A" }
tbl_col = { fg = "#05ADCD" }
tbl_cell = { fg = "#E3CB15", bg = "#3b1330" }

[help]
border = { fg = "#E5281A" }
chord = { fg = "#05ADCD" }
hovered = { reversed = true, bold = true }

[icon]
dirs = [
  { name = ".config", text = "", fg = "#E3CB15" },
  { name = ".git", text = "", fg = "#05ADCD" },
  { name = ".github", text = "", fg = "#E5281A" },
  { name = "Desktop", text = "", fg = "#05ADCD" },
  { name = "Documents", text = "", fg = "#05ADCD" },
  { name = "Downloads", text = "", fg = "#05ADCD" },
  { name = "Movies", text = "", fg = "#E3CB15" },
  { name = "Music", text = "", fg = "#E3CB15" },
  { name = "Pictures", text = "", fg = "#3FBF4A" },
  { name = "Videos", text = "", fg = "#E3CB15" },
]
conds = [
  { if = "orphan", text = "", fg = "#F4EEF8" },
  { if = "link", text = "", fg = "#685785" },
  { if = "dummy", text = "", fg = "#E5281A" },
  { if = "dir & hovered", text = "", fg = "#E5281A" },
  { if = "dir", text = "", fg = "#05ADCD" },
  { if = "exec", text = "", fg = "#E3CB15" },
  { if = "!dir", text = "", fg = "#F4EEF8" },
]
