# mac-theme — AeroSpace. Option is Super. SIP stays on.
config-version = 2
start-at-login = true
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

after-startup-command = [
    'exec-and-forget /opt/homebrew/bin/sketchybar',
    'exec-and-forget /opt/homebrew/bin/borders',
]

exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 8
outer.right = 10

[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-comma = 'focus-monitor --wrap-around next'
alt-shift-comma = 'move-node-to-monitor --wrap-around next'

alt-f = 'fullscreen'
alt-t = 'layout floating tiling'
alt-slash = 'layout tiles horizontal vertical'
alt-period = 'layout accordion horizontal vertical'
alt-b = 'balance-sizes'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-enter = 'exec-and-forget open -na Ghostty'
alt-space = 'exec-and-forget open -a Raycast'
alt-shift-t = 'exec-and-forget /bin/bash /Users/ye/Projects/mac-theme/bin/theme-pick'
alt-shift-n = 'exec-and-forget /bin/bash /Users/ye/Projects/mac-theme/bin/theme-set --next'
alt-shift-w = 'exec-and-forget /bin/bash /Users/ye/Projects/mac-theme/bin/theme-set --wallpaper'
alt-shift-p = 'exec-and-forget /bin/bash /Users/ye/Projects/mac-theme/bin/theme-set --prev'
alt-shift-r = 'exec-and-forget /opt/homebrew/bin/sketchybar --reload'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.jordanbaird.Ice'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'
